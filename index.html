<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>etotalshk - 專業試卷筆跡擦除與 PDF 打包平台</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            max-width: 1000px; width: 100%; background: white;
            padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center; box-sizing: border-box;
        }
        h1 { color: #1e3a8a; margin-bottom: 5px; }
        p.subtitle { color: #64748b; margin-bottom: 25px; }
        .status { color: #10b981; font-weight: bold; margin-bottom: 15px; font-size: 16px; }
        
        .upload-zone {
            display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;
        }
        .btn-upload {
            position: relative; background: #3b82f6; color: white; padding: 12px 24px;
            border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-block; border: none; font-size: 16px;
        }
        .btn-upload input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        
        .control-panel {
            background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 25px;
            display: flex; justify-content: center; gap: 20px; align-items: center; flex-wrap: wrap;
        }
        .btn {
            color: white; border: none; padding: 10px 20px; font-size: 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-blue { background: #2563eb; } .btn-blue:hover { background: #1d4ed8; }
        .btn-green { background: #10b981; } .btn-green:hover { background: #059669; }
        .btn-purple { background: #8b5cf6; } .btn-purple:hover { background: #7c3aed; }
        .btn:disabled { background: #cbd5e1 !important; cursor: not-allowed; }

        .tool-select { display: flex; gap: 10px; align-items: center; }
        .tool-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .tool-btn.active { background: #3b82f6; color: white; border-color: #2563eb; }

        .preview-area { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .box { flex: 1; min-width: 300px; max-width: 480px; }
        .box h3 { color: #334155; margin-bottom: 10px; }
        
        .img-wrap, .canvas-wrap { 
            width: 100%; min-height: 400px; border: 2px dashed #cbd5e1; 
            border-radius: 8px; background: #fafafa; display: flex; 
            align-items: center; justify-content: center; overflow: hidden;
        }
        img, canvas { max-width: 100%; height: auto; display: none; }
        .placeholder-text { color: #94a3b8; font-size: 14px; }
        canvas { cursor: crosshair; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 etotalshk 試卷筆跡擦除控制中心</h1>
    <p class="subtitle">專業級別：原生 AI 去墨水 • 手動修補 • 批量打包可列印 PDF</p>

    <div id="status" class="status">⚡ 系統原生引擎已就緒！請上傳或相機拍照。</div>

    <!-- 1. 上傳與相機快拍 -->
    <div class="upload-zone">
        <button class="btn-upload" id="upload-btn-file">
            📁 從相簿選取試卷
            <input type="file" id="file-input" accept="image/*">
        </button>
        <button class="btn-upload" id="upload-btn-cam" style="background: #14b8a6;">
            📸 用相機直接拍照
            <input type="file" id="camera-input" accept="image/*" capture="environment">
        </button>
    </div>

    <!-- 2. 控制面板 -->
    <div class="control-panel">
        <label>去筆跡強度偏好 (1-10)：
            <input type="number" id="strength" value="5" min="1" max="10" style="width: 45px; padding: 5px;">
        </label>

        <!-- 【修正】此按鈕不再預設 disabled 鎖定，永遠可以點擊 -->
        <button id="process-btn" class="btn btn-blue">✨ 執行 AI 自動擦除</button>

        <div class="tool-select">
            <span>局部手動修補：</span>
            <button id="tool-erase" class="tool-btn active">⚪ 橡皮擦(變白)</button>
            <button id="tool-restore" class="tool-btn">⚫ 恢復筆刷(還原)</button>
            <label><input type="range" id="brush-size" min="5" max="60" value="25" style="width:70px;">大小</label>
        </div>

        <button id="pdf-btn" class="btn btn-purple" disabled>📄 加入並打包 PDF</button>
    </div>

    <!-- 3. 雙畫布實時對比預覽 -->
    <div class="preview-area">
        <div class="box">
            <h3>原圖（含有手寫字）</h3>
            <div class="img-wrap">
                <span id="text-src-placeholder" class="placeholder-text">📸 請先點擊上方按鈕拍照或上傳試卷</span>
                <img id="image-src" alt="原圖" />
            </div>
        </div>
        <div class="box">
            <h3>處理結果（可直接手動塗抹修改）</h3>
            <div class="canvas-wrap">
                <span id="text-dst-placeholder" class="placeholder-text">✨ 點擊「執行 AI 自動擦除」後在此顯示</span>
                <canvas id="canvas-output"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const imgElement = document.getElementById('image-src');
    const fileInput = document.getElementById('file-input');
    const cameraInput = document.getElementById('camera-input');
    const processBtn = document.getElementById('process-btn');
    const pdfBtn = document.getElementById('pdf-btn');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('canvas-output');
    const ctx = canvas.getContext('2d');
    
    const srcPlaceholder = document.getElementById('text-src-placeholder');
    const dstPlaceholder = document.getElementById('text-dst-placeholder');

    let pdfPages = []; 
    let isDrawing = false;
    let currentTool = 'erase'; 
    let originalBackup = null; 
    let isImageLoaded = false; // 新增變數：用來記錄圖片是否真的加載進來了

    function handleImage(file) {
        if (!file) return;
        statusText.innerText = "⏳ 正在載入圖片中...";
        statusText.style.color = "#f59e0b";
        
        srcPlaceholder.style.display = 'none';
        imgElement.style.display = 'block';
        imgElement.src = URL.createObjectURL(file);
    }
    
    fileInput.addEventListener('change', (e) => handleImage(e.target.files[0]));
    cameraInput.addEventListener('change', (e) => handleImage(e.target.files[0]));

    imgElement.onload = function() {
        isImageLoaded = true; // 標記圖片就緒
        statusText.innerText = "👍 圖片載入完成，請點選「執行 AI 自動擦除」。";
        statusText.style.color = "#2563eb";
    };

    // 點擊執行自動擦除
    processBtn.addEventListener('click', () => {
        // 【防呆修正】如果根本沒加載圖片，直接跳出警示
        if (!isImageLoaded) {
            alert("請先點選上方的按鈕選取試卷或用相機拍照，再執行擦除功能喔！");
            return;
        }

        statusText.innerText = "⏳ 正在分析結構、移除筆跡並漂白背景...";
        statusText.style.color = "#f59e0b";

        setTimeout(() => {
            try {
                canvas.width = imgElement.naturalWidth;
                canvas.height = imgElement.naturalHeight;
                
                ctx.drawImage(imgElement, 0, 0);
                
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                
                let strengthVal = parseInt(document.getElementById('strength').value) || 5;
                let threshold = 110 + (strengthVal * 10); 

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];     
                    let g = data[i + 1]; 
                    let b = data[i + 2]; 
                    
                    let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                    
                    if (brightness > threshold || (b - r > 15) || (r - b > 25)) {
                        data[i] = 255;     
                        data[i + 1] = 255; 
                        data[i + 2] = 255; 
                    } else {
                        data[i] = 0;
                        data[i + 1] = 0;
                        data[i + 2] = 0;
                    }
                }
                
                ctx.putImageData(imgData, 0, 0);

                dstPlaceholder.style.display = 'none';
                canvas.style.display = 'block';

                originalBackup = ctx.getImageData(0, 0, canvas.width, canvas.height);

                statusText.innerText = "✅ 擦除完成！若有部分筆跡殘留，可直接在右側試卷上用「橡皮擦」手動抹除。";
                statusText.style.color = "#10b981";
                pdfBtn.disabled = false;
            } catch (err) {
                statusText.innerText = "❌ 處理失敗，請換一張更清晰的圖片再試。";
                statusText.style.color = "#ef4444";
                console.error(err);
            }
        }, 50);
    });

    // 手動局部修補功能
    document.getElementById('tool-erase').addEventListener('click', (e) => {
        currentTool = 'erase';
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
    });
    document.getElementById('tool-restore').addEventListener('click', (e) => {
        currentTool = 'restore';
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
    });

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches.clientX : e.clientX;
        const clientY = e.touches ? e.touches.clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function startDraw(e) { if(!originalBackup) return; isDrawing = true; draw(e); }
