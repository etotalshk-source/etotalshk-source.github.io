<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個 HTML 測試</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>歡迎使用 HTML 測試頁面</h1>
    <p>這是一個簡單的段落。您可以在這裡測試您的瀏覽器是否能正常解析 <span class="highlight">HTML</span> 及 <span class="highlight">CSS</span> 樣式。</p>
    
    <button onclick="showAlert()">點擊這裡測試 JavaScript</button>

    <script>
        function showAlert() {
            alert('恭喜！您的瀏覽器支援 JavaScript，測試成功！');
        }
    </script>

</body>
</html>
