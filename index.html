<script>
    const imgElement = document.getElementById('image-src');
    const fileInput = document.getElementById('file-input');
    const cameraInput = document.getElementById('camera-input');
    const urlInput = document.getElementById('url-input');
    const urlBtn = document.getElementById('url-btn');
    const processBtn = document.getElementById('process-btn');
    const pdfBtn = document.getElementById('pdf-btn');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('canvas-output');
    const ctx = canvas.getContext('2d');
    
    const srcPlaceholder = document.getElementById('text-src-placeholder');
    const dstPlaceholder = document.getElementById('text-dst-placeholder');

    let pdfPages = []; 
    let isDrawing = false;
    let currentTool = 'erase'; 
    let isImageLoaded = false; 

    // 方案 A：網址讀取邏輯
    urlBtn.addEventListener('click', function() {
        const url = urlInput.value.trim();
        if (!url) return alert("請先貼上有效的圖片網址喔！");
        updateStatus("⏳ 正在嘗試從網址載入圖片...", "#f59e0b", "#fef3c7");
        srcPlaceholder.style.display = 'none';
        imgElement.style.display = 'block';
        imgElement.src = url; 
    });

    // 方案 B / C：監聽上傳與相機
    fileInput.addEventListener('change', function() { loadLocalFile(this); });
    cameraInput.addEventListener('change', function() { loadLocalFile(this); });

    function loadLocalFile(inputElement) {
        if (!inputElement.files || inputElement.files.length === 0) return;
        updateStatus("⏳ 正在安全載入本地圖片...", "#f59e0b", "#fef3c7");
        
        const file = inputElement.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            srcPlaceholder.style.display = 'none';
            imgElement.style.display = 'block';
            imgElement.src = e.target.result; 
        };
        reader.readAsDataURL(file);
    }

    imgElement.onload = function() {
        isImageLoaded = true;
        updateStatus("📸 照片載入完成，請點擊「執行 AI 自動擦除」！", "#10b981", "#d1fae5");
    };

    imgElement.onerror = function() {
        updateStatus("❌ 圖片載入失敗。若使用方案 A，可能對方網站有防盜連限制，請直接改用方案 B 或 C！", "#dc3545", "#fee2e2");
    };

    // ✨ 核心：純原生 JS 高速去筆跡算法
    processBtn.addEventListener('click', function() {
        if (!isImageLoaded) return alert("請先上傳或拍攝一張試卷照片！");
        updateStatus("⏳ 正在提取色彩矩陣、過濾原子筆墨水...", "#2563eb", "#dbeafe");

        setTimeout(() => {
            try {
                canvas.width = imgElement.naturalWidth;
                canvas.height = imgElement.naturalHeight;
                
                ctx.drawImage(imgElement, 0, 0);
                
                // 💡 捕捉安全性報錯
                let imgData;
                try {
                    imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                } catch(corsErr) {
                    throw new Error("【瀏覽器安全攔截】由於此網路圖片有跨網域保護限制，AI 無法讀取像素。請直接下載圖片到手機中，並改用【方案 B】重新選取上傳，即可順利執行！");
                }

                const data = imgData.data;
                const strengthVal = parseInt(document.getElementById('strength').value) || 5;
                const threshold = 15 + (strengthVal * 5); 

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    let isBlue = (b - r > threshold) && (b - g > threshold - 5);
                    let isRed = (r - g > threshold) && (r - b > threshold);

                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    let isBackground = gray > (255 - strengthVal * 15);

                    if (isBlue || isRed || isBackground) {
                        data[i] = 255;  
                        data[i + 1] = 255; 
                        data[i + 2] = 255; 
                    } else {
                        let enhance = gray < 120 ? 0 : gray;
                        data[i] = enhance;
                        data[i + 1] = enhance;
                        data[i + 2] = enhance;
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                
                dstPlaceholder.style.display = 'none';
                canvas.style.display = 'block';
                pdfBtn.disabled = false;
                updateStatus("🎉 擦除完成！如邊緣有殘留黑點，可使用下方【局部手動修補】手動塗抹抹除。", "#10b981", "#d1fae5");

            } catch (err) {
                // 顯示人性化的錯誤引導
                updateStatus(err.message, "#dc3545", "#fee2e2");
                alert(err.message);
                canvas.style.display = 'none';
                dstPlaceholder.style.display = 'block';
            }
        }, 50);
    });

    // 局部手動修補按鈕切換
    document.getElementById('tool-erase').addEventListener('click', function() {
        currentTool = 'erase';
        this.classList.add('active');
        document.getElementById('tool-restore').classList.remove('active');
    });
    document.getElementById('tool-restore').addEventListener('click', function() {
        currentTool = 'restore';
        this.classList.add('active');
        document.getElementById('tool-erase').classList.remove('active');
    });

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches.clientX : e.clientX;
        const clientY = e.touches ? e.touches.clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function startDraw(e) { if(canvas.style.display !== 'block') return; isDrawing = true; draw(e); }
    function endDraw() { isDrawing = false; ctx.beginPath(); }
    
    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getCanvasPos(e);
        const size = document.getElementById('brush-size').value;

        ctx.lineWidth = size;
        ctx.lineCap = 'round';

        if (currentTool === 'erase') {
            ctx.strokeStyle = '#ffffff'; 
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        } else {
            ctx.save();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', endDraw);

    // PDF 打包功能
    pdfBtn.addEventListener('click', function() {
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        pdfPages.push({ data: imgData, w: canvas.width, h: canvas.height });
        
        let confirmAction = confirm(`已成功將此頁加入暫存（目前共 ${pdfPages.length} 頁）。\n點擊「確定」立即下載整份 PDF，點擊「取消」可繼續上傳下一頁試卷共同打包。`);
        
        if(confirmAction) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: pdfPages.w > pdfPages.h ? 'l' : 'p', unit: 'px', format: [pdfPages.w, pdfPages.h] });
            
            for(let i=0; i<pdfPages.length; i++) {
                if(i > 0) pdf.addPage([pdfPages[i].w, pdfPages[i].h], pdfPages[i].w > pdfPages[i].h ? 'l' : 'p');
                pdf.addImage(pdfPages[i].data, 'JPEG', 0, 0, pdfPages[i].w, pdfPages[i].h);
            }
            pdf.save('etotalshk_cleaned_exams.pdf');
            pdfPages = []; 
            pdfBtn.disabled = true;
        }
    });

    function updateStatus(text, textColor, bgColor) {
        statusText.innerText = text;
        statusText.style.color = textColor;
        statusText.style.backgroundColor = bgColor;
    }
</script>
