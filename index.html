<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>etotalshk - 專業試卷筆跡擦除與 PDF 打包平台</title>
    
    <!-- 引入穩定且全球通用的 OpenCV.js 與 jsPDF 核心加速節點 -->
    <script src="https://cloudflare.com" type="text/javascript" defer></script>
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            max-width: 1000px; width: 100%; background: white;
            padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center; box-sizing: border-box;
        }
        h1 { color: #1e3a8a; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #64748b; margin-bottom: 25px; font-size: 14px; }
        .status { color: #dc3545; font-weight: bold; margin-bottom: 15px; font-size: 16px; background: #ffeeba; padding: 10px; border-radius: 8px; display: inline-block; }
        
        .url-zone {
            background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 20px;
            display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
        }
        .url-input {
            width: 50%; min-width: 250px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
        }

        .upload-zone {
            display: flex; gap: 20px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap;
        }
        .upload-card {
            background: #eff6ff; border: 2px dashed #3b82f6; border-radius: 12px;
            padding: 15px 30px; cursor: pointer; text-align: center; transition: 0.2s;
            font-weight: bold; color: #1d4ed8; font-size: 16px; min-width: 200px;
        }
        .upload-card:hover { background: #dbeafe; }
        .upload-card input { display: none; }
        
        .control-panel {
            background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 25px;
            display: flex; justify-content: center; gap: 20px; align-items: center; flex-wrap: wrap;
        }
        .btn {
            color: white; border: none; padding: 12px 24px; font-size: 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-blue { background: #2563eb; } .btn-blue:hover { background: #1d4ed8; }
        .btn-green { background: #10b981; } .btn-green:hover { background: #059669; }
        .btn-purple { background: #8b5cf6; } .btn-purple:hover { background: #7c3aed; }
        .btn:disabled { background: #cbd5e1 !important; cursor: not-allowed; }

        .tool-select { display: flex; gap: 10px; align-items: center; }
        .tool-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .tool-btn.active { background: #3b82f6; color: white; border-color: #2563eb; }

        .preview-area { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; width: 100%; }
        .box { flex: 1; min-width: 300px; max-width: 480px; }
        .box h3 { color: #334155; margin-bottom: 10px; }
        
        .img-wrap, .canvas-wrap { 
            width: 100%; min-height: 400px; border: 2px dashed #cbd5e1; 
            border-radius: 8px; background: #fafafa; display: flex; 
            align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        img, canvas { max-width: 100%; max-height: 600px; height: auto; display: none; }
        .placeholder-text { color: #94a3b8; font-size: 14px; position: absolute; }
        canvas { cursor: crosshair; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 etotalshk 試卷筆跡擦除控制中心</h1>
    <p class="subtitle">專業級別：原生 AI 去墨水 • 手動修補 • 批量打包可列印 PDF</p>

    <div id="status" class="status">⏳ 正在下載 AI 核心引擎，請稍候約 5~10 秒...</div>

    <!-- 方案 A -->
    <div class="url-zone">
        <span>🔗 方案 A：輸入網路圖片網址 </span>
        <input type="text" id="url-input" class="url-input" placeholder="請在此貼上圖片連結">
        <button id="url-btn" class="btn btn-blue" style="padding: 8px 15px; font-size: 14px;" disabled>載入網路圖</button>
    </div>

    <!-- 方案 B / C -->
    <div class="upload-zone">
        <div class="upload-card" onclick="document.getElementById('file-input').click()">
            📁 方案 B：點此從相簿選取試卷
            <input type="file" id="file-input" accept="image/*">
        </div>
        <div class="upload-card" style="background: #f0fdf4; border-color: #10b981; color: #15803d;" onclick="document.getElementById('camera-input').click()">
            📸 方案 C：點此用相機直接拍照
            <input type="file" id="camera-input" accept="image/*" capture="environment">
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <label>去筆跡強度 (1-10)：
            <input type="number" id="strength" value="5" min="1" max="10" style="width: 45px; padding: 5px;">
        </label>

        <button id="process-btn" class="btn btn-blue" disabled>✨ 執行 AI 自動擦除</button>

        <div class="tool-select">
            <span>局部手動修補：</span>
            <button id="tool-erase" class="tool-btn active">⚪ 橡皮擦(變白)</button>
            <button id="tool-restore" class="tool-btn">⚫ 恢復筆刷(還原)</button>
            <label><input type="range" id="brush-size" min="5" max="60" value="25" style="width:70px;">大小</label>
        </div>

        <button id="pdf-btn" class="btn btn-purple" disabled>📄 加入並打包 PDF</button>
    </div>

    <!-- 雙畫布實時對比預覽 -->
    <div class="preview-area">
        <div class="box">
            <h3>原圖（含有手寫字）</h3>
            <div class="img-wrap">
                <span id="text-src-placeholder" class="placeholder-text">📸 請先透過上方功能框放入試卷照片</span>
                <img id="image-src" alt="原圖" crossorigin="anonymous" />
            </div>
        </div>
        <div class="box">
            <h3>處理結果（可直接手動塗抹修改）</h3>
            <div class="canvas-wrap">
                <span id="text-dst-placeholder" class="placeholder-text">✨ 點擊「執行 AI 自動擦除」後在此顯示</span>
                <canvas id="canvas-output"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const imgElement = document.getElementById('image-src');
    const fileInput = document.getElementById('file-input');
    const cameraInput = document.getElementById('camera-input');
    const urlInput = document.getElementById('url-input');
    const urlBtn = document.getElementById('url-btn');
    const processBtn = document.getElementById('process-btn');
    const pdfBtn = document.getElementById('pdf-btn');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('canvas-output');
    const ctx = canvas.getContext('2d');
    
    const srcPlaceholder = document.getElementById('text-src-placeholder');
    const dstPlaceholder = document.getElementById('text-dst-placeholder');

    let pdfPages = []; 
    let isDrawing = false;
    let currentTool = 'erase'; 
    let isImageLoaded = false; 

    // 自動檢測 OpenCV.js 是否加載完畢
    let checkOpenCV = setInterval(() => {
        if (typeof cv !== 'undefined' && cv.Mat) {
            clearInterval(checkOpenCV);
            statusText.innerText = "✅ 系統原生引擎已就緒！請選擇一種方式放入考卷。";
            statusText.style.color = "#10b981";
            statusText.style.background = "#d1fae5";
            
            urlBtn.disabled = false;
            processBtn.disabled = false;
        }
    }, 500);

    // 方案 A：網址讀取邏輯
    urlBtn.addEventListener('click', function() {
        const url = urlInput.value.trim();
        if (!url) return alert("請先貼上有效的圖片網址喔！");
        updateStatus("⏳ 正在嘗試從網址載入圖片...", "#f59e0b", "#fef3c7");
        srcPlaceholder.style.display = 'none';
        imgElement.style.display = 'block';
        imgElement.src = url; 
    });

    // 方案 B / C：監聽上傳與相機
    fileInput.addEventListener('change', function() { loadLocalFile(this); });
    cameraInput.addEventListener('change', function() { loadLocalFile(this); });

    function loadLocalFile(inputElement) {
        if (!inputElement.files || inputElement.files.length === 0) return;
        updateStatus("⏳ 正在安全載入本地圖片...", "#f59e0b", "#fef3c7");
        
        const file = inputElement.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            srcPlaceholder.style.display = 'none';
            imgElement.style.display = 'block';
            imgElement.src = e.target.result; 
        };
        reader.readAsDataURL(file);
    }

    imgElement.onload = function() {
        isImageLoaded = true;
        updateStatus("📸 照片載入完成，請點擊「執行 AI 自動擦除」！", "#10b981", "#d1fae5");
    };

    imgElement.onerror = function() {
        updateStatus("❌ 圖片載入失敗。若使用方案 A，可能對方網站有防盜連限制，請直接改用方案 B 或 C！", "#dc3545", "#fee2e2");
    };

    // ✨ 核心：AI 智能去筆跡算法（已完全修正空白參數）
    processBtn.addEventListener('click', function() {
        if (!isImageLoaded) return alert("請先上傳或拍攝一張試卷照片！");
        updateStatus("⏳ 正在提取色彩矩陣、過濾原子筆墨水...", "#2563eb", "#dbeafe");

        setTimeout(() => {
            try {
                let src = cv.imread(imgElement);
                let hsv = new cv.Mat();
                let mask1 = new cv.Mat();
                let mask2 = new cv.Mat();
                let mask3 = new cv.Mat();
                let maskRed = new cv.Mat();
                let mask = new cv.Mat();
                let inpainted = new cv.Mat();
                let gray = new cv.Mat();
                let thresh = new cv.Mat();

                let strengthVal = parseInt(document.getElementById('strength').value) || 5;
                // 適應性二值化的區塊大小，必須為奇數
                let blockSize = 11 + (strengthVal * 2);
